name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build-gh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Ensure this path points exactly to the folder containing your index.html
          path: ./dist/ 

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
